<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치이카와 짤 생성기</title>
<style>
:root{--bg:#f4f8fb;--fg:#1d2b36;--card:#fff;--ac:#5b93c4;--bd:#d5e2ec}
@media (prefers-color-scheme:dark){:root{--bg:#14202a;--fg:#e8f0f6;--card:#1d2d3a;--bd:#2f4455}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;margin:0 0 14px}
h2{font-size:14px;margin:0 0 8px}
canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--bd);display:block}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px;display:grid;gap:12px}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.thumbs button{padding:0;border:3px solid transparent;border-radius:10px;overflow:hidden;background:none;aspect-ratio:1;cursor:pointer}
.thumbs button.on{border-color:var(--ac)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
label{font-size:14px;display:grid;gap:6px}
input[type=text]{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--ac)}
#d{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:0;background:var(--ac);color:#fff;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body><main>
<h1>치이카와 짤 생성기</h1>
<canvas id="c"></canvas>
<div class="panel">
<div><h2>사진 고르기</h2><div class="thumbs" id="th"></div></div>
<label>넣을 문구<input type="text" id="t" value="Test message!!!"></label>
<label>글씨 크기<input type="range" id="s" min="20" max="160" value="70"></label>
<label>글씨 세로 위치<input type="range" id="y" min="5" max="95" value="85"></label>
<button id="d">PNG 이미지 만들기 · 저장</button>
</div>
<div id="r" style="margin-top:14px;font-size:14px"></div>
</main>

const c=document.getElementById('c'),x=c.getContext('2d'),img=new Image();
function draw(){
 if(!img.naturalWidth)return;
 c.width=img.naturalWidth;c.height=img.naturalHeight;
 x.drawImage(img,0,0);
 const size=+document.getElementById('s').value*(c.width/968);
 x.font='900 '+size+'px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
 x.textAlign='center';x.textBaseline='middle';
 x.lineJoin='round';x.lineWidth=size/5;x.strokeStyle='#000';x.fillStyle='#fff';
 const px=c.width/2,py=c.height*document.getElementById('y').value/100,t=document.getElementById('t').value;
 x.strokeText(t,px,py,c.width*0.95);x.fillText(t,px,py,c.width*0.95);
}
img.onload=draw;
const th=document.getElementById('th');
PICS.forEach((u,i)=>{
 const b=document.createElement('button');b.setAttribute('aria-label','사진 '+(i+1));
 const m=new Image();m.src=u;b.appendChild(m);
 b.onclick=()=>{[...th.children].forEach(k=>k.classList.remove('on'));b.classList.add('on');img.src=u;};
 th.appendChild(b);
});
th.children[0].click();
['t','s','y'].forEach(i=>document.getElementById(i).addEventListener('input',draw));
document.getElementById('d').addEventListener('click',()=>{
 c.toBlob(async b=>{
  if(!b)return;
  const file=new File([b],'chiikawa.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  const r=document.getElementById('r');
  r.innerHTML='<p>이미지를 길게 눌러서 "사진에 추가"를 눌러 저장하세요.</p>';
  const im=new Image();im.src=URL.createObjectURL(b);im.style.cssText='width:100%;border-radius:12px';
  r.appendChild(im);r.scrollIntoView({behavior:'smooth'});
 },'image/png');
});
</script></body></html>
